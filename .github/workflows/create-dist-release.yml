name: Create dist zip on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate:
    name: Create site release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static assets
        run: pnpm run build

      - name: Stage release files
        run: |
          STAGE_DIR="/tmp/generation-theme-child"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          rsync -a ./ "$STAGE_DIR"/ \
            --exclude .git/ \
            --exclude .ai/ \
            --exclude .agents/ \
            --exclude .claude/ \
            --exclude .codex/ \
            --exclude .cursor/ \
            --exclude .gemini/ \
            --exclude node_modules/ \
            --exclude bin/ \
            --exclude resources/ \
            --exclude public/ \
            --exclude .vite-fonts/ \
            --exclude /vite.hot \
            --exclude ".env*" \
            --exclude .github/ \
            --exclude .vscode/ \
            --exclude .editorconfig \
            --exclude .nvmrc \
            --exclude .prettierignore \
            --exclude .stylelintignore \
            --exclude .gitattributes \
            --exclude .gitignore \
            --exclude .DS_Store \
            --exclude eslint.config.js \
            --exclude stylelint.config.js \
            --exclude postcss.config.js \
            --exclude prettier.config.js \
            --exclude composer.json \
            --exclude composer.lock \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude pnpm-lock.yaml \
            --exclude pnpm-workspace.yaml \
            --exclude README.md \
            --exclude AGENTS.md \
            --exclude CLAUDE.md \
            --exclude GEMINI.md \
            --exclude phpcs.xml \
            --exclude CHANGELOG.md \
            --exclude .mcp.json \
            --exclude vite.config.mjs \
            --exclude "*.code-workspace" \
            --exclude console/ \
            --exclude gchild \
            --exclude docs/ \
            --exclude postcss-plugins/ \
            --exclude stylelint-rules/

      - name: Create ZIP
        run: |
          cd /tmp
          ZIP_NAME="${{ github.event.repository.name }}-${{ github.event.release.tag_name }}-dist.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" generation-theme-child

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/${{ github.event.repository.name }}-${{ github.event.release.tag_name }}-dist.zip
